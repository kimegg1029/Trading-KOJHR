services:
  - type: web
    name: ozu-trading
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ozu-trading-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: OZU_PASSWORD_HASH
        sync: false
      - key: HYERYEONG_PASSWORD_HASH
        sync: false
      - key: TRUST_PROXY
        value: "1"
databases:
  - name: ozu-trading-db
    plan: basic-256mb
    databaseName: ozu_trading
    user: ozu_trading
